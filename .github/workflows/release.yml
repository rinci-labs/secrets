name: Release

# Publishes @rinci/secrets when a version tag is pushed: `git tag v0.1.1 && git push --follow-tags`.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - name: Tag matches package version
        working-directory: packages/secrets
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: bun run test
      - run: bun run --filter @rinci/secrets build
      - run: npm publish --provenance --access public
        working-directory: packages/secrets
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
